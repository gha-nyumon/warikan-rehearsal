name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7

      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 道具をインストールする
        run: pip install -r requirements-dev.txt

      - name: 書き方をチェックする（ruff）
        run: ruff check .

      - name: テストを実行する（pytest）
        run: pytest
