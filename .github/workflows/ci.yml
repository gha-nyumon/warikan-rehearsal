name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# GITHUB_TOKEN の権限は、全体では「読むだけ」にする
permissions:
  contents: read

# 同じブランチの古い実行は取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # テストは再利用ワークフローを呼ぶ（公開のワークフローと同じものを使う）
  test:
    uses: $/.github/workflows/test.yml

  comment:
    # 同じリポジトリのプルリクエストのときだけ（フォークからの PR では動かさない）
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # このジョブにだけ、プルリクエストに書き込む権限を足す
    permissions:
      pull-requests: write
    steps:
      - name: テストの結果をプルリクエストにコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --body "テストと書き方のチェックはすべて成功しました（Python 3.12・3.13・3.14）。実行の記録: $RUN_URL"
