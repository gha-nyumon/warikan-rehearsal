name: Hello

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7

      - name: あいさつ
        run: echo "こんにちは、GitHub Actions！"

      - name: ファイルの一覧
        run: cat READ.md

      - name: ランナーの情報
        run: |
          echo "OS: ${{ runner.os }}"
          echo "ブランチ: ${{ github.ref_name }}"
          echo "きっかけ: ${{ github.event_name }}"
          python3 --version
