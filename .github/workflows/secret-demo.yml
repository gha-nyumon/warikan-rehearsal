name: シークレットの練習

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: シークレットと変数を受け取る
        env:
          PRACTICE_SECRET: ${{ secrets.PRACTICE_SECRET }}
          PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
        run: |
          echo "変数 PYTHON_VERSION の値: $PYTHON_VERSION"
          if [ -n "$PRACTICE_SECRET" ]; then
            echo "シークレット PRACTICE_SECRET を受け取りました（値はログに出しません）"
          else
            echo "シークレット PRACTICE_SECRET が登録されていません"
            exit 1
          fi
